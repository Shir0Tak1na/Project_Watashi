# Project Watashi -- prototype configuration
#
# All paths are resolved relative to THIS file's directory (prototype/).

capture:
  # 0 = all monitors combined, 1 = primary, 2 = secondary ...
  monitor: 1

  # Fixed region as "x,y,w,h" in virtual screen coordinates.
  # null => automatically use a strip across the lower part of the monitor,
  # which is where subtitles usually live.
  region: null

  # Height of the automatic strip, as a fraction of monitor height.
  region_ratio: 0.18

  # Target capture rate. The capture thread never queues frames up: if OCR is
  # slower than this, stale frames are dropped rather than processed late.
  fps: 10

  # Skip OCR entirely when the frame changed less than this (mean absolute
  # difference of a 96px wide grayscale signature, 0-255 scale).
  # Raise it if the overlay keeps redrawing noise; lower it if brief subtitles
  # are being missed.
  diff_threshold: 2.0
  signature_width: 96

  # Downscale frames wider than this before OCR, scaling the boxes back.
  # 0 = native resolution, which is the measured best default.
  #
  # Downscaling is a trap: it does NOT reliably save time (the detector's
  # behaviour on a squeezed frame varies) and it costs accuracy. Measured on a
  # fixed 1600x304 region: native 354 ms, 960 -> 246 ms, 640 -> 286 ms, and at
  # 640 the words merge ("he broke through" became "hebrokethroughtothevoidrealm").
  #
  # The real latency lever is the REGION SIZE, not the pixel scale. A 1280 px
  # wide strip is ~117 ms; 640 px is ~89 ms. Pick the smallest region that
  # still contains the whole subtitle line.
  max_width: 0

  # Hard floor between two OCR runs, in seconds. 0 = no floor.
  min_ocr_interval: 0.0

  # Hold OCR back until the frame has stopped changing for this many milliseconds.
  #
  # 0 = recognise the very frame that changed, which is the original behaviour and
  # the right thing for a subtitle that appears and then holds still.
  #
  # It is the WRONG thing for anything animated. A subtitle that fades in, or
  # scrolling text and danmaku, spends its first few hundred milliseconds as
  # half-drawn moving glyphs; recognising that frame produces nonsense. With this
  # set, a change only arms the trigger and OCR is released once the frame has been
  # still for the given time -- so motion costs nothing and a settled frame is
  # recognised once, not once per frame.
  #
  # Measured trade-off: the delay is added to the first appearance of a static
  # subtitle (settle_ms + OCR), which is why the default stays 0 and this is opt-in.
  # Try 150-250 for video sites; `selfcheck_settle` asserts the mechanism.
  settle_ms: 0

# Live audio translation.
#
# The screen path needs text on screen. A livestream without subtitles has
# none, so this path listens to what the machine is playing instead:
#
#   system loopback -> speech recognition -> the same corpus/rules/model
#   -> the same overlay
#
# Off by default. Run `run.cmd --live` to turn it on for one run, or set
# enabled: true here to make it the default. The ASR weights are a one-time
# download: `run.cmd fetch_model --asr small`. After that, watching a stream
# never touches the network.
live:
  enabled: false

  # system | microphone | file
  source: system

  # "" = default device, or a name substring / index from --list-audio-devices
  device: ""

  # used when source is file; a PCM WAV, for testing or translating a recording
  file: ""

  # spoken language, or "auto" to let Whisper decide per phrase
  language: auto

  # tiny | base | small | medium | large-v3, or a directory fetched by
  # fetch_model.py --asr. small is the quality/latency default for a desktop CPU.
  asr_model: small
  asr_compute_type: int8
  asr_threads: 4
  # 1 = greedy, fastest. More is slightly more accurate and much slower.
  asr_beam_size: 1
  # Whisper's own VAD after the energy gate; off is faster and noisier
  asr_vad: true

  # Characters of the previous phrase passed to Whisper as initial_prompt.
  # Keeps names and technical terms from being re-guessed every phrase without
  # enabling condition_on_previous_text, whose hallucination chain can poison
  # every later subtitle. 0 = no context.
  context_chars: 120

  # How a phrase is cut. Every value here trades latency against completeness:
  # silence_ms is added to every subtitle, max_segment_s bounds the wait during
  # a monologue, and min_speech_ms keeps a door slam from becoming one.
  silence_ms: 600
  min_speech_ms: 300
  max_segment_s: 8.0

  # Energy gate. A phrase starts when RMS exceeds the learned noise floor times
  # vad_threshold. Raise it if background music keeps triggering subtitles.
  vad_threshold: 2.5
  min_rms: 0.004
  pre_roll_ms: 300

  # WAV files: pace them like a live stream, or process as fast as possible
  file_realtime: false

  # where downloaded Whisper weights are cached; "" = faster-whisper's cache
  model_dir: ""
  # refuse to download: the honest setting for an offline machine
  local_files_only: false

  # Internal, not settings-panel fields: WASAPI mixes at 48 kHz, and 100 ms is
  # the block the segmenter was measured with.
  capture_rate: 48000
  block_ms: 100

# ONNX Runtime / RapidOCR tuning.
#
# These three settings are the difference between ~3580 ms and ~61 ms per
# frame. RapidOCR's stock values are tuned for full page documents and are
# actively harmful for a wide, short subtitle strip. See watashi/ocr.py for the
# full explanation, and bench_ocr.py / diagnose_ort.py to re-measure.
ocr:
  # ORT default = all cores. On a 20 core machine that is ~5x SLOWER than 4
  # because the threads thrash over a small model. Measured sweep (640 px):
  #   1 -> 133 ms, 2 -> 80 ms, 3 -> 61 ms, 4 -> 168 ms, 6 -> 261 ms, 8 -> 384 ms
  intra_op_threads: 4
  inter_op_threads: 1

  # RapidOCR sets this to false, forcing a fresh buffer allocation per run.
  use_mem_arena: true

  # RapidOCR's default is "min" with limit_side_len 736, which scales a
  # 1280x176 strip up to 5344x736 -- a 17x pixel blowup. "max" keeps wide
  # strips at native resolution (it only ever downscales).
  det_limit_type: max
  det_limit_side_len: null

  # Direction classification. Subtitles are horizontal, so this is pure cost.
  use_cls: false

  # Only translate and draw the largest N recognised text boxes. 0 = no cap.
  #
  # What this does NOT do, because the obvious reading is wrong: it does not make OCR
  # faster. RapidOCR detects and recognises in one call, so a cap applied afterwards
  # cannot un-recognise anything.
  #
  # What it does: it stops the expensive half. Measured, one box costs about 20 ms to
  # recognise, but one sentence costs 71-350 ms to *translate* with the local model.
  # On a dense screen, refusing to translate 40 of 50 boxes saves far more than the
  # recognition it cannot avoid, and it keeps the overlay and the history readable.
  #
  # Largest-first, because the small boxes on a real screen are mostly noise: a
  # fragment of texture or a UI ornament read as one character. Dropping them is a
  # quality improvement as well as a cost one.
  #
  # The real lever on OCR latency remains the region size: select the smallest area
  # that still contains the text you want.
  max_boxes: 0

translation:
  source: auto
  target: zh-CN

  # Drop results below this mean confidence (0 = keep everything).
  min_confidence: 0.0

  # --- local translation model (requirement R1 / M3) ------------------- #
  #
  # Path to a local CTranslate2 model directory, or null to run corpus+rules
  # only. Nothing here is a cloud API: after a one-time download the model runs
  # entirely on this machine.
  #
  #   prototype\run.cmd fetch_model      # fetches it once (~617 MiB)
  #
  # The model is NLLB-200-distilled-600M (int8), a purpose-built translator
  # rather than a chat LLM: much faster on CPU and far better at sentences.
  # If the directory is missing or incomplete the app still runs, on the corpus
  # path alone.
  nmt_model: ../models/llm/nllb-200-distilled-600M-ct2-int8

  nmt_compute_type: int8      # int8 | int8_float32 | float32
  nmt_beam_size: 1            # beam 4 measured worse here, not better
  nmt_intra_threads: 4        # 4 is fastest on a 20 core machine, as with OCR

  # Term protection: the corpus stays authoritative and the model only fills the
  # gaps. When a term's placeholder does not survive the model, or the output is
  # a repetition loop, the corpus result is used instead -- keeping terminology
  # correct matters more than fluency.
  protect_terms: true
  protect_min_confidence: 0.4

  # Finish the line with the model before it is painted, instead of painting the
  # corpus answer and replacing it a moment later.
  #
  # true  = the subtitle appears once, as a complete sentence. Lines the corpus
  #         already translates in full (term-only lines, cache hits) still cost
  #         nothing; the rest pay one batched model call before the frame is
  #         published.
  # false = the old two-tier display: instant corpus result, model refinement
  #         later. Faster first paint, but the first thing on screen can be half
  #         source language ("the 剑意 of this 宗门 is a myth").
  final_translation: true

  # Join a sentence that OCR split across visual lines before translating it.
  #
  # A two-line subtitle arrives as two separate recognised lines. Translating
  # each alone loses the grammar of the sentence they belong to ("the sword
  # intent of this" / "sect is a myth"); NLLB has no memory between calls, so
  # the lines have to be joined first. The rules are conservative: the previous
  # line must not end with sentence punctuation, the next must be vertically
  # adjacent with a similar height, and it must look like a continuation
  # (lowercase Latin start, CJK, or after a comma/dash/bracket).
  #
  # Turn this off for screens full of separate short labels that lack
  # punctuation; the join would otherwise treat rows as one sentence.
  join_fragmented_lines: true
  join_max_lines: 3
  join_max_chars: 240

corpus:
  # Layered, highest priority first. Any .json file in these directories is
  # loaded; see prototype/corpus/demo_terms.json for the format.
  user:
    - ../plugins/user/custom_rules
  domain:
    - corpus
    - ../rules/slang
    - ../rules/fiction
  general:
    - ../rules/dictionaries

rules:
  # Rule definitions for words missing from the corpus (requirement R3).
  files:
    - rules/engine_rules.json

overlay:
  # bar | panel | both | none
  mode: both

  # plate = semi transparent dark plate (robust)
  # bare  = true transparency with outlined text (real subtitle look)
  subtitle_style: plate

  # External JSON design file (see docs/presentation-spec.md for every field).
  #
  # This is the zero-code customization interface: point it at a file, edit and
  # save while the overlay is running, and the new design is applied in about
  # half a second. The file is authoritative, so the scalar appearance keys below
  # (subtitle_size, bar_alpha, bar_bottom_margin) stop overriding it.
  #
  #   prototype\run.cmd --presentation-file config\presentation.json
  #
  # (a relative command line path is relative to the shell; a relative value in
  # this file is relative to prototype/, so the two forms above differ)
  #
  # null = use the presentation preset / the keys below.
  presentation_file: null

  font_family: null      # null = auto detect a CJK capable font
  subtitle_size: 24
  panel_size: 13
  bar_height: 96
  bar_alpha: 0.72
  bar_bottom_margin: 90
  panel_width: 540
  panel_height: 320
  panel_history: 12
  dim_low_confidence: true

logging:
  print_lines: false     # echo each recognised line + translation to the console
  print_trace: false     # include per span provenance (corpus/rule ids)
  print_refined: true    # echo the improved translation when the model finishes
